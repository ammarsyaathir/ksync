<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover K-Pop Events | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20">
                        K
                    </div>
                    <div>
                        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-pink-600 to-indigo-600 bg-clip-text text-transparent">K-Sync</span>
                        <span class="text-xs font-semibold text-slate-400 block -mt-1">Malaysia</span>
                    </div>
                </a>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="/" class="text-sm font-medium text-slate-600 hover:text-pink-600 transition-colors">Home</a>
                    <a href="/events.html" class="text-sm font-bold text-pink-600">Discover Events</a>
                    <a href="/buddies.html" class="text-sm font-medium text-slate-600 hover:text-pink-600 transition-colors flex items-center">
                        <i class="fas fa-user-group me-1.5 text-pink-500"></i> Event Buddy
                    </a>
                    <a href="/submit-event.html" class="text-sm font-medium text-slate-600 hover:text-pink-600 transition-colors">Submit Event</a>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="/login.html" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-all">Log In</a>
                    <a href="/submit-event.html" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 text-white font-bold text-xs shadow-md shadow-pink-500/20 transition-all">
                        <i class="fas fa-plus me-1"></i> Add Event
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- SEARCH & FILTER HEADER -->
    <section class="bg-white border-b border-slate-200 py-8 px-4">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mb-2">Discover K-Pop Events in Malaysia</h1>
            <p class="text-xs sm:text-sm text-slate-500 mb-6 font-medium">Browse verified concerts, fan gatherings, cup sleeve events & cup sleeve events.</p>

            <form id="search-form" class="flex flex-col sm:flex-row gap-3">
                <div class="flex-grow relative">
                    <i class="fas fa-search absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Search by artist, event name, city or venue..."
                           class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>
                <button type="submit" class="px-6 py-3 rounded-2xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs transition-all">
                    Filter Results
                </button>
            </form>
        </div>
    </section>

    <!-- MAIN EVENT GRID -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
        <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-3xl p-4 border border-slate-200 animate-pulse h-80"></div>
            <div class="bg-white rounded-3xl p-4 border border-slate-200 animate-pulse h-80"></div>
            <div class="bg-white rounded-3xl p-4 border border-slate-200 animate-pulse h-80"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-xs font-medium">
            <p>© 2026 K-Sync Malaysia. Final Year Project - K-Pop Event Tracking System.</p>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('search') || '';
        document.getElementById('search-input').value = initialQuery;

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('search-input').value;
            fetchEvents(query);
        });

        document.addEventListener('DOMContentLoaded', () => {
            fetchEvents(initialQuery);
        });

        async function fetchEvents(query = '') {
            const container = document.getElementById('events-grid');
            try {
                const url = query ? `/api/events?search=${encodeURIComponent(query)}` : '/api/events';
                const res = await fetch(url);
                const result = await res.json();

                if (result.status === 'success' && result.data.length > 0) {
                    renderEvents(result.data);
                } else {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12 bg-white rounded-3xl border border-slate-200">
                            <i class="fas fa-search-minus text-4xl text-slate-300 mb-3"></i>
                            <h3 class="text-base font-bold text-slate-700">No Events Found</h3>
                            <p class="text-xs text-slate-400 mt-1">Try searching with a different artist or location.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="col-span-full text-center py-8 bg-rose-50 text-rose-700 rounded-2xl border border-rose-200 text-xs font-bold">
                        Error fetching events from API.
                    </div>
                `;
            }
        }

        function renderEvents(events) {
            const container = document.getElementById('events-grid');
            container.innerHTML = events.map(ev => `
                <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-all group flex flex-col">
                    <div class="relative h-48 bg-slate-100 overflow-hidden">
                        <img src="${ev.poster_url || 'https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?auto=format&fit=crop&w=600&q=80'}" 
                             alt="${ev.event_name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute top-3 left-3 bg-pink-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow-md">
                            ${ev.category_name || 'Concert'}
                        </div>
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <p class="text-xs font-bold text-pink-600 mb-1 flex items-center">
                                <i class="fas fa-music me-1.5"></i> ${ev.artist_name || 'K-Pop Artist'}
                            </p>
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-pink-600 transition-colors line-clamp-1 mb-2">
                                ${ev.event_name}
                            </h3>
                            <div class="space-y-1 text-xs text-slate-500 mb-4">
                                <p class="flex items-center"><i class="far fa-calendar text-slate-400 w-4 me-1"></i> ${new Date(ev.event_date).toLocaleDateString('en-MY', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })}</p>
                                <p class="flex items-center"><i class="fas fa-location-dot text-slate-400 w-4 me-1"></i> ${ev.venue_name || 'Kuala Lumpur'}, ${ev.city || 'Malaysia'}</p>
                            </div>
                        </div>
                        <a href="/event-details.html?id=${ev.id}" 
                           class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-pink-50 hover:text-pink-600 text-slate-700 font-bold text-xs text-center transition-all">
                            View Event Details <i class="fas fa-chevron-right ms-1 text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
