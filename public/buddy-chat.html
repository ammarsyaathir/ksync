<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Buddy Live Chat | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- NAVBAR -->
    <nav class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 sm:px-6 z-10 flex-shrink-0">
        <div class="flex items-center space-x-3">
            <a href="/buddies.html" class="p-2 text-slate-500 hover:text-slate-800 rounded-xl hover:bg-slate-100">
                <i class="fas fa-arrow-left text-base"></i>
            </a>
            <div>
                <h1 class="text-sm font-bold text-slate-900" id="chat-title">Event Buddy Group Chat</h1>
                <p class="text-[10px] text-pink-600 font-semibold" id="chat-subtitle">BLACKPINK World Tour in KL 2026</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 me-1.5 animate-pulse"></span> Live Chat
            </span>
        </div>
    </nav>

    <!-- CHAT MESSAGES AREA -->
    <div id="messages-container" class="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-100/60">
        <div class="text-center my-4">
            <span class="text-[10px] bg-slate-200 text-slate-600 px-3 py-1 rounded-full font-bold">
                🤝 Welcome to Event Buddy Group Chat! Keep conversations friendly and event-focused.
            </span>
        </div>
    </div>

    <!-- LOCKED CHAT NOTICE -->
    <div id="locked-notice" class="hidden p-3 bg-rose-50 text-rose-700 text-xs font-bold text-center border-t border-rose-200">
        <i class="fas fa-lock me-1"></i> This event chat room is closed (24h post-event limit reached).
    </div>

    <!-- INPUT BOX -->
    <form id="chat-form" class="p-3 bg-white border-t border-slate-200 flex items-center space-x-2 flex-shrink-0">
        <input type="text" id="message-input" required placeholder="Type your message to concert buddies..."
               class="flex-grow bg-slate-50 text-slate-900 px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-xs font-medium">
        <button type="submit" class="px-5 py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-xs shadow-md shadow-pink-500/20 hover:from-pink-600 hover:to-purple-700 transition-all flex items-center">
            <span>Send</span> <i class="fas fa-paper-plane ms-1.5 text-xs"></i>
        </button>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event_id') || '1';
        const user = JSON.parse(localStorage.getItem('ksync_user') || '{"id": 1, "full_name": "Fan User"}');

        document.addEventListener('DOMContentLoaded', () => {
            fetchMessages();
            setInterval(fetchMessages, 3000);
        });

        async function fetchMessages() {
            try {
                const res = await fetch(`/api/chat/${eventId}`);
                const result = await res.json();

                if (result.status === 'success') {
                    if (result.is_locked) {
                        document.getElementById('locked-notice').classList.remove('hidden');
                        document.getElementById('chat-form').classList.add('hidden');
                    }
                    renderMessages(result.messages);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('messages-container');
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="text-center my-8 text-xs text-slate-400 font-medium">
                        No messages yet. Start the conversation with your concert buddies!
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isMe = msg.user_id == user.id;
                return `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                        <span class="text-[10px] text-slate-400 font-semibold mb-1 px-1">${msg.full_name || 'Fan'}</span>
                        <div class="max-w-[75%] p-3 rounded-2xl text-xs font-medium ${isMe ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-br-none shadow-sm' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none shadow-sm'}">
                            ${msg.message}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            try {
                const res = await fetch(`/api/chat/${eventId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        message: message,
                        is_organizer: user.role_name === 'Organizer' ? 1 : 0
                    })
                });

                const result = await res.json();
                if (result.status === 'success') {
                    input.value = '';
                    fetchMessages();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Error sending message.");
            }
        });
    </script>
</body>
</html>
