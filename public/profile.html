<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20">K</div>
                    <div>
                        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-pink-600 to-indigo-600 bg-clip-text text-transparent">K-Sync</span>
                        <span class="text-xs font-semibold text-slate-400 block -mt-1">Malaysia</span>
                    </div>
                </a>
                <a href="/" class="text-xs font-bold text-pink-600 hover:underline">Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-12">
        <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl">
            <div class="flex items-center space-x-6 mb-8 pb-8 border-b border-slate-100">
                <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-pink-500 to-indigo-600 flex items-center justify-center text-white text-3xl font-bold shadow-md">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900" id="user-name">Fan Account</h1>
                    <p class="text-xs font-bold text-pink-600" id="user-email">fan@ksync.my</p>
                    <span class="inline-block bg-pink-100 text-pink-700 text-[10px] font-bold px-3 py-1 rounded-full mt-2" id="user-role">K-Pop Fan</span>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <a href="/saved-events.html" class="p-6 rounded-2xl bg-slate-50 border border-slate-200 hover:border-pink-300 transition-all flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-500">Tracked Events</p>
                        <h3 class="text-xl font-bold text-slate-900 mt-1">View Bookmarks</h3>
                    </div>
                    <i class="fas fa-heart text-pink-500 text-2xl"></i>
                </a>
                <a href="/buddies.html" class="p-6 rounded-2xl bg-slate-50 border border-slate-200 hover:border-pink-300 transition-all flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-500">Event Buddies</p>
                        <h3 class="text-xl font-bold text-slate-900 mt-1">View Connections</h3>
                    </div>
                    <i class="fas fa-users text-indigo-500 text-2xl"></i>
                </a>
            </div>
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('ksync_user') || '{"full_name": "K-Sync Fan User", "email": "fan@ksync.my", "role_name": "Fan"}');
        document.getElementById('user-name').innerText = user.full_name;
        document.getElementById('user-email').innerText = user.email;
        document.getElementById('user-role').innerText = user.role_name;
    </script>
</body>
</html>
