<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20">K</div>
                    <div>
                        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-pink-600 to-indigo-600 bg-clip-text text-transparent">K-Sync</span>
                        <span class="text-xs font-semibold text-slate-400 block -mt-1">Malaysia</span>
                    </div>
                </a>
                <a href="/login.html" class="text-xs font-bold text-pink-600 hover:underline">Already registered? Log In</a>
            </div>
        </div>
    </nav>

    <div class="max-w-lg mx-auto px-4 py-12 w-full">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white text-xl font-bold mx-auto mb-3 shadow-md shadow-pink-500/20">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Join K-Sync Malaysia</h1>
                <p class="text-xs text-slate-500 mt-1 font-medium">Create your account to discover, save, or submit K-Pop events.</p>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Account Role</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="p-3 rounded-xl border border-slate-200 bg-slate-50 flex items-center space-x-2 cursor-pointer hover:border-pink-300">
                            <input type="radio" name="role" value="Fan" checked class="text-pink-600">
                            <div>
                                <p class="text-xs font-bold text-slate-900">K-Pop Fan</p>
                                <p class="text-[10px] text-slate-500 font-medium">Discover & Save Events</p>
                            </div>
                        </label>
                        <label class="p-3 rounded-xl border border-slate-200 bg-slate-50 flex items-center space-x-2 cursor-pointer hover:border-pink-300">
                            <input type="radio" name="role" value="Organizer" class="text-pink-600">
                            <div>
                                <p class="text-xs font-bold text-slate-900">Organizer</p>
                                <p class="text-[10px] text-slate-500 font-medium">Submit & Manage Events</p>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                    <input type="text" id="full_name" required placeholder="e.g. Nur Aina Zahra"
                           class="w-full bg-slate-50 text-slate-900 placeholder-slate-400 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="name@domain.com"
                           class="w-full bg-slate-50 text-slate-900 placeholder-slate-400 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required minlength="6" placeholder="Minimum 6 characters"
                           class="w-full bg-slate-50 text-slate-900 placeholder-slate-400 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm font-medium">
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 hover:from-pink-600 hover:to-purple-600 text-white font-bold text-sm shadow-md shadow-pink-500/20 transition-all">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            const user = {
                id: Date.now(),
                email: email,
                full_name: fullName,
                role_name: role
            };

            localStorage.setItem('ksync_user', JSON.stringify(user));
            alert("Account created successfully! Welcome to K-Sync Malaysia.");
            window.location.href = '/';
        });
    </script>
</body>
</html>
