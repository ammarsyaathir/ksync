<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>K-Sync Malaysia - Storyboard Portal (Version 2)</title>
  <style>
    body { margin:0; padding:0; font-family: Arial, sans-serif; background: #0f172a; color: #fff; }
    .header { background: #1e293b; padding: 24px 40px; border-bottom: 2px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    .title h1 { margin: 0 0 6px 0; font-size: 26px; font-weight: 800; }
    .title p { margin: 0; font-size: 14px; color: #94a3b8; }
    .btn-group { display: flex; gap: 14px; }
    .btn { text-decoration: none; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: bold; transition: all 0.2s; }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-primary:hover { background: #7dd3fc; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }
    iframe { width: 100%; height: calc(100vh - 90px); border: none; display: block; background: #fff; }
  </style>
  <script>
    function loadView(url, activeBtnId) {
      document.getElementById('storyboard-frame').src = url;
      document.querySelectorAll('.btn').forEach(b => {
        b.className = 'btn btn-secondary';
      });
      document.getElementById(activeBtnId).className = 'btn btn-primary';
    }
  </script>
</head>
<body>
  <div class="header">
    <div class="title">
      <h1>K-Sync Malaysia · Chapter 4 Storyboard (Version 2)</h1>
      <p>Modular Paper-Based Black-and-White Wireframe Storyboard across 8 Functional Modules (28 Screens)</p>
    </div>
    <div class="btn-group">
      <a href="javascript:void(0)" id="btn-4screen" class="btn btn-primary" onclick="loadView('storyboard_v2_4screens_per_page.html', 'btn-4screen')">📑 4 Screens Per Page (7 Parts)</a>
      <a href="javascript:void(0)" id="btn-1screen" class="btn btn-secondary" onclick="loadView('storyboard_v2_single_screen.html', 'btn-1screen')">📄 1 Screen Per Page (28 Screens)</a>
      <a href="javascript:void(0)" id="btn-legacy" class="btn btn-secondary" onclick="loadView('storyboard_v1_legacy.html', 'btn-legacy')">⏮️ Legacy 4-Page Overview</a>
    </div>
  </div>
  <iframe id="storyboard-frame" src="storyboard_v2_4screens_per_page.html"></iframe>
</body>
</html>
