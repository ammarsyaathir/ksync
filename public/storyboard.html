(S14-S18): Listings scoring &gt;=90% auto-publish to Public Landing (S01) and Event Radar (S02).</text><text x="1734.0" y="2904.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >3. Held Submissions (&lt;90%): Route to Admin Queue (S20) for human forensic audit and Organiser Remediation (S21).</text><text x="1734.0" y="2938.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >4. Community Scam Reports: Fans flagging suspicious listings immediately escalate to Admin Executive Dashboard (S19).</text><text x="1734.0" y="2972.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >5. Event Status Updates (UC025): Organiser updates propagate instantly across Fan Saved Events and Transit Alerts.</text><rect x="3330.0" y="1850.0" width="1540.0" height="1490.0" fill="#fff" stroke="#000" stroke-width="4" rx="12"/><line x1="3330.0" y1="1916.0" x2="4870.0" y2="1916.0" stroke="#000" stroke-width="3"/><text x="3352.0" y="1894.0" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" text-anchor="start" fill="#000" font-style="normal" >Scope, status, and governance architecture</text><text x="3354.0" y="1960.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#000" font-style="normal" >1. Four-Role System Architecture</text><text x="3354.0" y="1994.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >K-Sync Malaysia strictly implements 4 user personas with robust role-based access control (RBAC):</text><text x="3354.0" y="2020.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >• Guest (Unauthenticated): Browse public events, view transit radar, read verified scorecards.</text><text x="3354.0" y="2046.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >• Fan Member: Save concerts, participate in verified discussions, receive LRT transit updates.</text><text x="3354.0" y="2072.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >• Organiser (Promoter): Submit events with SSM proof, upload posters, manage lifecycle status (UC025).</text><text x="3354.0" y="2098.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >• System Admin: Full executive oversight, verification queue inspection, scam escalation &amp; audit trails.</text><text x="3354.0" y="2150.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#000" font-style="normal" >2. Four-Pillar Forensic Verification SOP</text><text x="3354.0" y="2184.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >Pillar 1 - SSM Business Registration: Real-time validation of organizer legal entity number.</text><text x="3354.0" y="2210.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >Pillar 2 - Venue Confirmation: Verification of booking contract with recognized Malaysian venues.</text><text x="3354.0" y="2236.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >Pillar 3 - Whitelisted Ticketing URL: Zero-tolerance policy against scalper Telegram / bank links.</text><text x="3354.0" y="2262.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >Pillar 4 - Gemini Multimodal Vision AI: Deep visual inspection of poster dates, artists, and logos.</text><text x="3354.0" y="2314.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#000" font-style="normal" >3. Event Radar &amp; Transit Integration</text><text x="3354.0" y="2348.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >Event Radar (/events/radar) integrates interactive spatial maps and RapidKL transit data:</text><text x="3354.0" y="2374.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >• Walking routes from LRT Bukit Jalil (Exit B) to Axiata Arena Gate 1 (350m sheltered walkway).</text><text x="3354.0" y="2400.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >• MRT Kajang Line and Monorail connectivity for Zepp KL and Mega Star Arena concerts.</text><text x="3354.0" y="2426.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >• Real-time operating hours warnings and return transit recommendations for fans.</text><text x="3354.0" y="2478.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#000" font-style="normal" >4. Anti-Scalper &amp; Anti-Scam Architecture</text><text x="3354.0" y="2512.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >Only whitelisted official primary ticketing domains are accepted (GoLive Asia, Ticket2U, BookMyShow).</text><text x="3354.0" y="2538.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#000" font-style="normal" >
