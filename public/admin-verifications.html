<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Verification Hub | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen">

    <nav class="bg-slate-800 border-b border-slate-700 h-16 flex items-center justify-between px-6">
        <div class="flex items-center space-x-3">
            <span class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-black text-xs px-3 py-1 rounded-full">ADMIN</span>
            <h1 class="text-sm font-bold text-white">K-Sync Organizer & Event Verifications</h1>
        </div>
        <a href="/" class="text-xs font-bold text-slate-400 hover:text-white">Exit Admin Portal</a>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-8">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-white flex items-center">
                <i class="fas fa-shield-check text-pink-400 me-2"></i> Pending Verifications
            </h2>
        </div>

        <div id="verifications-container" class="space-y-4">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 animate-pulse h-40"></div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchVerifications();
        });

        async function fetchVerifications() {
            const container = document.getElementById('verifications-container');
            try {
                const res = await fetch('/api/admin/verifications');
                const result = await res.json();

                if (result.status === 'success' && result.data.length > 0) {
                    container.innerHTML = result.data.map(user => `
                        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <div class="flex items-center space-x-2 mb-1">
                                    <h3 class="text-base font-bold text-white">${user.full_name}</h3>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${user.is_verified_organizer ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">
                                        ${user.is_verified_organizer ? 'Verified' : 'Pending Review'}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-400 font-mono">${user.email} • ${user.organization_name || 'Individual Fanclub'}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="handleAction(${user.id}, 'verify')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl">
                                    Approve Verification
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="bg-slate-800 p-8 rounded-2xl text-center border border-slate-700 text-slate-400 text-xs font-bold">
                            No pending verifications at this moment.
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = `<div class="p-4 bg-rose-950 text-rose-300 text-xs font-bold rounded-xl">Error fetching verification applications.</div>`;
            }
        }

        async function handleAction(userId, action) {
            try {
                const res = await fetch('/api/admin/verifications/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, action: action })
                });
                const result = await res.json();
                alert(result.message);
                fetchVerifications();
            } catch (err) {
                alert("Action failed.");
            }
        }
    </script>
</body>
</html>
