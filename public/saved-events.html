<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Events | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20">K</div>
                    <div>
                        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-pink-600 to-indigo-600 bg-clip-text text-transparent">K-Sync</span>
                        <span class="text-xs font-semibold text-slate-400 block -mt-1">Malaysia</span>
                    </div>
                </a>
                <a href="/events.html" class="text-xs font-bold text-pink-600 hover:underline">Discover More Events</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center">
                    <i class="fas fa-bookmark text-pink-500 me-2"></i> Your Saved & Tracked Events
                </h1>
                <p class="text-xs text-slate-500 mt-1 font-medium">Quick access to your bookmarked K-Pop concerts and fan meets</p>
            </div>
        </div>

        <div id="saved-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 bg-white rounded-3xl border border-slate-200">
                <i class="fas fa-heart-crack text-4xl text-slate-300 mb-3"></i>
                <h3 class="text-base font-bold text-slate-700">No Saved Events Yet</h3>
                <p class="text-xs text-slate-400 mt-1">Click the "I'm Interested" button on any event to track it here!</p>
                <a href="/events.html" class="inline-block mt-4 px-4 py-2 rounded-xl bg-pink-500 text-white font-bold text-xs">Explore Events</a>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 mt-auto text-center text-xs text-slate-500 font-medium">
        <p>© 2026 K-Sync Malaysia.</p>
    </footer>
</body>
</html>
