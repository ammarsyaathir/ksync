<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20">
                        K
                    </div>
                    <div>
                        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-pink-600 to-indigo-600 bg-clip-text text-transparent">K-Sync</span>
                        <span class="text-xs font-semibold text-slate-400 block -mt-1">Malaysia</span>
                    </div>
                </a>
                <a href="/" class="text-xs font-bold text-pink-600 hover:underline">Back to Home</a>
            </div>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <div class="max-w-md mx-auto px-4 py-16 w-full">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white text-xl font-bold mx-auto mb-3 shadow-md shadow-pink-500/20">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Log In to K-Sync</h1>
                <p class="text-xs text-slate-500 mt-1 font-medium">Access event tracking, saved events & Event Buddy chat.</p>
            </div>

            <!-- AUTH BUTTONS -->
            <div class="mb-6 space-y-2.5">
                <button type="button" id="supabase-login-btn" onclick="handleSupabaseGoogleSignIn()" 
                        class="w-full py-2.5 px-4 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-xs border border-emerald-300 shadow-sm transition-all flex items-center justify-center">
                    <i class="fas fa-bolt text-emerald-600 me-2 text-sm"></i>
                    <span>Continue with Supabase Auth</span>
                </button>
            </div>

            <!-- DEMO FORM -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="fan@ksync.my / organizer@ksync.my"
                           class="w-full bg-slate-50 text-slate-900 placeholder-slate-400 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                           class="w-full bg-slate-50 text-slate-900 placeholder-slate-400 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm font-medium">
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 hover:from-pink-600 hover:to-purple-600 text-white font-bold text-sm shadow-md shadow-pink-500/20 transition-all">
                    Sign In
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-xs">
                <p class="font-bold text-slate-800 mb-2 flex items-center"><i class="fas fa-key text-amber-500 me-1.5"></i> Quick Demo Accounts:</p>
                <div class="space-y-1 text-slate-600 font-mono text-[11px] bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <p><strong class="text-emerald-700">Organizer:</strong> organizer@ksync.my</p>
                    <p><strong class="text-pink-700">K-Pop Fan:</strong> fan@ksync.my</p>
                </div>
            </div>

            <div class="mt-6 text-center text-xs text-slate-600 font-medium">
                Don't have an account? <a href="/register.html" class="text-pink-600 font-bold hover:underline">Register Now</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://aposfkuaqgxlfdetcdyq.supabase.co";
        const SUPABASE_KEY = "sb_publishable_jSPFpJLiBG56Y7_IGRwc9g_wBAIphFU";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleSupabaseGoogleSignIn() {
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/login.html' }
                });
                if (error) throw error;
            } catch (err) {
                alert("Supabase Auth Error: " + err.message);
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // Sync user session to localStorage
            const user = {
                id: email.includes('organizer') ? 2 : 1,
                email: email,
                full_name: email.split('@')[0],
                role_name: email.includes('organizer') ? 'Organizer' : 'Fan'
            };

            localStorage.setItem('ksync_user', JSON.stringify(user));
            alert("Signed in successfully as " + user.full_name + "!");
            window.location.href = '/';
        });
    </script>
</body>
</html>
