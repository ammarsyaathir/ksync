<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | K-Sync Malaysia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20">
                        K
                    </div>
                    <div>
                        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-pink-600 to-indigo-600 bg-clip-text text-transparent">K-Sync</span>
                        <span class="text-xs font-semibold text-slate-400 block -mt-1">Malaysia</span>
                    </div>
                </a>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="/" class="text-sm font-medium text-slate-600 hover:text-pink-600 transition-colors">Home</a>
                    <a href="/events.html" class="text-sm font-medium text-slate-600 hover:text-pink-600 transition-colors">Discover Events</a>
                    <a href="/buddies.html" class="text-sm font-medium text-slate-600 hover:text-pink-600 transition-colors flex items-center">
                        <i class="fas fa-user-group me-1.5 text-pink-500"></i> Event Buddy
                    </a>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="/login.html" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-all">Log In</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT AREA -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-10">
        <div id="details-container">
            <div class="bg-white rounded-3xl p-8 border border-slate-200 animate-pulse h-96"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-xs font-medium">
            <p>© 2026 K-Sync Malaysia. Final Year Project - K-Pop Event Tracking System.</p>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id') || '1';

        document.addEventListener('DOMContentLoaded', () => {
            fetchEventDetails(eventId);
        });

        async function fetchEventDetails(id) {
            const container = document.getElementById('details-container');
            try {
                const res = await fetch(`/api/events/${id}`);
                const result = await res.json();

                if (result.status === 'success' && result.data) {
                    const ev = result.data;
                    renderDetails(ev);
                } else {
                    container.innerHTML = `
                        <div class="text-center py-16 bg-white rounded-3xl border border-slate-200">
                            <i class="fas fa-exclamation-circle text-4xl text-rose-400 mb-3"></i>
                            <h2 class="text-lg font-bold text-slate-800">Event Not Found</h2>
                            <a href="/events.html" class="inline-block mt-4 text-xs font-bold text-pink-600">Back to Events List</a>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="p-6 bg-rose-50 text-rose-700 text-xs font-bold rounded-2xl">Error loading event details.</div>`;
            }
        }

        function renderDetails(ev) {
            const container = document.getElementById('details-container');
            container.innerHTML = `
                <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 sm:p-8">
                        <div>
                            <img src="${ev.poster_url || 'https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?auto=format&fit=crop&w=600&q=80'}"
                                 alt="${ev.event_name}" class="w-full h-auto rounded-2xl object-cover shadow-md">
                        </div>
                        <div class="flex flex-col justify-between space-y-6">
                            <div>
                                <div class="flex items-center space-x-2 mb-3">
                                    <span class="bg-pink-100 text-pink-700 text-xs font-bold px-3 py-1 rounded-full">
                                        ${ev.category_name || 'Concert'}
                                    </span>
                                    ${ev.is_verified_organizer ? `
                                        <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full flex items-center">
                                            <i class="fas fa-check-circle me-1"></i> Verified Organizer
                                        </span>
                                    ` : ''}
                                </div>
                                <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mb-2">${ev.event_name}</h1>
                                <p class="text-sm font-bold text-pink-600 mb-4 flex items-center">
                                    <i class="fas fa-music me-1.5"></i> ${ev.artist_name || 'K-Pop Artist'}
                                </p>

                                <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs text-slate-700 font-medium mb-6">
                                    <p class="flex items-center"><i class="far fa-calendar text-pink-500 w-5 me-2 text-sm"></i> <strong>Date:</strong> ${new Date(ev.event_date).toLocaleDateString('en-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                    <p class="flex items-center"><i class="far fa-clock text-pink-500 w-5 me-2 text-sm"></i> <strong>Time:</strong> ${ev.start_time || 'TBA'} - ${ev.end_time || 'TBA'}</p>
                                    <p class="flex items-center"><i class="fas fa-location-dot text-pink-500 w-5 me-2 text-sm"></i> <strong>Venue:</strong> ${ev.venue_display || ev.venue_name || 'Kuala Lumpur'}</p>
                                    ${ev.transit_info ? `<p class="flex items-start"><i class="fas fa-train text-pink-500 w-5 me-2 text-sm mt-0.5"></i> <strong>Transit:</strong> ${ev.transit_info}</p>` : ''}
                                </div>

                                <div class="text-xs text-slate-600 leading-relaxed space-y-2">
                                    <h3 class="font-bold text-slate-800">About this Event</h3>
                                    <p>${ev.description || 'No description provided.'}</p>
                                </div>
                            </div>

                            <!-- ACTIONS -->
                            <div class="space-y-3 pt-4 border-t border-slate-100">
                                <button id="interested-btn" onclick="toggleInterest(${ev.id})" 
                                        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold text-xs shadow-md shadow-pink-500/20 transition-all flex items-center justify-center space-x-2">
                                    <i class="fas fa-heart"></i>
                                    <span>I'm Interested (<span id="interest-count">${ev.interest_count || 0}</span>)</span>
                                </button>
                                <a href="/buddies.html?event_id=${ev.id}" 
                                   class="w-full py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs text-center transition-all block">
                                    <i class="fas fa-user-group me-1.5 text-pink-500"></i> Find Event Buddies Going To This Event
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleInterest(id) {
            const countEl = document.getElementById('interest-count');
            let current = parseInt(countEl.innerText) || 0;
            countEl.innerText = current + 1;
            alert("Marked as Interested! Log in to save to your personal profile.");
        }
    </script>
</body>
</html>
