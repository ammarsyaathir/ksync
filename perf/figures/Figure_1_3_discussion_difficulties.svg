<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="388" viewBox="0 0 1100 388"><rect width="1100" height="388" fill="#ffffff"/><text x="18" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b">Figure 1.3  Difficulties experienced when discussing events across group chats or platforms</text><text x="18" y="62" font-family="Arial" font-size="13" fill="#64748b">Question 24: "What difficulties do you experience when discussing K-Pop events across different group chats or platforms?" (multiple answers allowed)</text><line x1="18" y1="78" x2="1082" y2="78" stroke="#e2e8f0" stroke-width="1.5"/><line x1="440" y1="96" x2="440" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="440" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">0%</text><line x1="549" y1="96" x2="549" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="549" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">20%</text><line x1="658" y1="96" x2="658" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="658" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">40%</text><line x1="767" y1="96" x2="767" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="767" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">60%</text><line x1="876" y1="96" x2="876" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="876" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">80%</text><line x1="985" y1="96" x2="985" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="985" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">100%</text><text x="396" y="112" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">The same questions are repeatedly asked in different</text><text x="396" y="128" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">groups</text><rect x="440" y="111" width="288.305" height="22" rx="3" fill="#7c3aed"/><text x="737.3050000000001" y="127" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">52.9%</text><text x="396" y="168" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">Important messages get buried among other messages</text><rect x="440" y="159" width="288.305" height="22" rx="3" fill="#7c3aed"/><text x="737.3050000000001" y="175" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">52.9%</text><text x="396" y="208" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">Event information is scattered across different</text><text x="396" y="224" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">groups</text><rect x="440" y="207" width="256.695" height="22" rx="3" fill="#7c3aed"/><text x="705.6949999999999" y="223" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">47.1%</text><text x="396" y="264" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">I do not experience these difficulties</text><rect x="440" y="255" width="213.64" height="22" rx="3" fill="#94a3b8"/><text x="662.64" y="271" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">39.2%</text><text x="396" y="304" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">It is difficult to find previous discussions or</text><text x="396" y="320" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">shared information</text><rect x="440" y="303" width="203.285" height="22" rx="3" fill="#7c3aed"/><text x="652.285" y="319" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">37.3%</text><text x="18" y="372" font-family="Arial" font-size="11.5" fill="#64748b">Source: K-Sync Malaysia fan survey (n = 51). Percentages are of all respondents.</text></svg>