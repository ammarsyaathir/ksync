<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="388" viewBox="0 0 1100 388"><rect width="1100" height="388" fill="#ffffff"/><text x="18" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b">Figure 1.4  Where fans currently discuss K-pop events or communicate with other fans</text><text x="18" y="62" font-family="Arial" font-size="13" fill="#64748b">Question 22: "Where do you usually discuss K-Pop events or communicate with other fans?"</text><line x1="18" y1="78" x2="1082" y2="78" stroke="#e2e8f0" stroke-width="1.5"/><line x1="440" y1="96" x2="440" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="440" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">0%</text><line x1="549" y1="96" x2="549" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="549" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">20%</text><line x1="658" y1="96" x2="658" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="658" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">40%</text><line x1="767" y1="96" x2="767" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="767" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">60%</text><line x1="876" y1="96" x2="876" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="876" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">80%</text><line x1="985" y1="96" x2="985" y2="332" stroke="#e2e8f0" stroke-width="1"/><text x="985" y="348" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">100%</text><text x="396" y="120" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">Telegram groups</text><rect x="440" y="111" width="203.285" height="22" rx="3" fill="#ec4899"/><text x="652.285" y="127" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">37.3%</text><text x="396" y="168" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">X (Twitter) replies or group chats</text><rect x="440" y="159" width="128.075" height="22" rx="3" fill="#ec4899"/><text x="577.075" y="175" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">23.5%</text><text x="396" y="216" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">WhatsApp groups</text><rect x="440" y="207" width="85.565" height="22" rx="3" fill="#ec4899"/><text x="534.565" y="223" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">15.7%</text><text x="396" y="264" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">Facebook groups or online forums</text><rect x="440" y="255" width="64.31" height="22" rx="3" fill="#ec4899"/><text x="513.31" y="271" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">11.8%</text><text x="396" y="312" font-family="Arial" font-size="13.5" fill="#1e293b" text-anchor="end">I rarely participate in group discussions</text><rect x="440" y="303" width="64.31" height="22" rx="3" fill="#94a3b8"/><text x="513.31" y="319" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1e293b">11.8%</text><text x="18" y="372" font-family="Arial" font-size="11.5" fill="#64748b">Source: K-Sync Malaysia fan survey (n = 51). Percentages are of all respondents.</text></svg>