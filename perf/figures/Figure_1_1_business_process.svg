<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b7c93"/></marker></defs><rect width="920" height="650" fill="#ffffff"/><text x="460" y="34" font-family="Arial" font-size="21" font-weight="bold" fill="#243247" text-anchor="middle">How fans currently find, discuss and confirm K-pop event information</text><g transform="translate(0,50)"><rect x="250" y="18" width="420" height="56" rx="13" fill="#eef3f9" stroke="#8296ad" stroke-width="1.6"/><text x="460" y="41.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">Event organizer or fan community</text><text x="460" y="62.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">publishes an announcement</text><rect x="250" y="104" width="420" height="56" rx="13" fill="#eef3f9" stroke="#8296ad" stroke-width="1.6"/><text x="460" y="127.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">Information appears across separate platforms</text><text x="460" y="148.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">(X, Instagram, TikTok, Telegram and websites)</text><rect x="250" y="190" width="420" height="56" rx="13" fill="#eef3f9" stroke="#8296ad" stroke-width="1.6"/><text x="460" y="213.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">Fan searches and compares event details</text><text x="460" y="234.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">across sources</text><rect x="250" y="276" width="420" height="56" rx="13" fill="#eef3f9" stroke="#8296ad" stroke-width="1.6"/><text x="460" y="299.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">Fan uses group chats or community posts to ask</text><text x="460" y="320.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">questions and look for previous answers</text><polygon points="460,344 650,406 460,468 270,406" fill="#fdf6e4" stroke="#c9a227" stroke-width="1.6"/><text x="460" y="401.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">Are complete and current details</text><text x="460" y="422.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">easy to find and confirm?</text><rect x="90" y="506" width="330" height="64" rx="13" fill="#fdeeee" stroke="#c98b8b" stroke-width="1.6"/><text x="255" y="533.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">Fan searches other posts, revisits sources,</text><text x="255" y="554.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">or asks the same question again</text><rect x="490" y="506" width="330" height="64" rx="13" fill="#eef7ee" stroke="#7fa87f" stroke-width="1.6"/><text x="655" y="533.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">Fan uses the information found</text><text x="655" y="554.1" font-family="Arial" font-size="16" fill="#243247" text-anchor="middle">to plan attendance</text><path d="M460,74 L460,96" fill="none" stroke="#6b7c93" stroke-width="1.6" marker-end="url(#ah)"/><path d="M460,160 L460,182" fill="none" stroke="#6b7c93" stroke-width="1.6" marker-end="url(#ah)"/><path d="M460,246 L460,268" fill="none" stroke="#6b7c93" stroke-width="1.6" marker-end="url(#ah)"/><path d="M460,332 L460,344" fill="none" stroke="#6b7c93" stroke-width="1.6" marker-end="url(#ah)"/><path d="M270,406 L220,406 L220,498" fill="none" stroke="#6b7c93" stroke-width="1.6" marker-end="url(#ah)"/><path d="M650,406 L700,406 L700,498" fill="none" stroke="#6b7c93" stroke-width="1.6" marker-end="url(#ah)"/><path d="M90,538 L48,538 L48,218 L242,218" fill="none" stroke="#6b7c93" stroke-width="1.6" marker-end="url(#ah)"/><text x="262" y="394" font-family="Arial" font-size="15" fill="#6b7c93" text-anchor="end">No</text><text x="662" y="394" font-family="Arial" font-size="15" fill="#6b7c93" text-anchor="start">Yes</text></g></svg>