<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="538" viewBox="0 0 1180 538"><rect width="1180" height="538" fill="#ffffff"/><text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#1e293b">How many platforms fans usually check to find K-pop event information</text><line x1="640" y1="80" x2="640" y2="452" stroke="#e2e8f0" stroke-width="1"/><text x="640" y="482" font-family="Arial" font-size="19" fill="#64748b" text-anchor="middle">0%</text><line x1="740" y1="80" x2="740" y2="452" stroke="#e2e8f0" stroke-width="1"/><text x="740" y="482" font-family="Arial" font-size="19" fill="#64748b" text-anchor="middle">20%</text><line x1="840" y1="80" x2="840" y2="452" stroke="#e2e8f0" stroke-width="1"/><text x="840" y="482" font-family="Arial" font-size="19" fill="#64748b" text-anchor="middle">40%</text><line x1="940" y1="80" x2="940" y2="452" stroke="#e2e8f0" stroke-width="1"/><text x="940" y="482" font-family="Arial" font-size="19" fill="#64748b" text-anchor="middle">60%</text><line x1="1040" y1="80" x2="1040" y2="452" stroke="#e2e8f0" stroke-width="1"/><text x="1040" y="482" font-family="Arial" font-size="19" fill="#64748b" text-anchor="middle">80%</text><line x1="1140" y1="80" x2="1140" y2="452" stroke="#e2e8f0" stroke-width="1"/><text x="1140" y="482" font-family="Arial" font-size="19" fill="#64748b" text-anchor="middle">100%</text><text x="602" y="116" font-family="Arial" font-size="21" fill="#1e293b" text-anchor="end">Four or more platforms</text><rect x="640" y="99" width="160" height="34" rx="5" fill="#7c3aed"/><text x="812" y="126" font-family="Arial" font-size="22" font-weight="bold" fill="#1e293b">32%</text><text x="602" y="192" font-family="Arial" font-size="21" fill="#1e293b" text-anchor="end">Three platforms</text><rect x="640" y="175" width="140" height="34" rx="5" fill="#7c3aed"/><text x="792" y="202" font-family="Arial" font-size="22" font-weight="bold" fill="#1e293b">28%</text><text x="602" y="268" font-family="Arial" font-size="21" fill="#1e293b" text-anchor="end">Two platforms</text><rect x="640" y="251" width="120" height="34" rx="5" fill="#7c3aed"/><text x="772" y="278" font-family="Arial" font-size="22" font-weight="bold" fill="#1e293b">24%</text><text x="602" y="344" font-family="Arial" font-size="21" fill="#1e293b" text-anchor="end">One platform</text><rect x="640" y="327" width="40" height="34" rx="5" fill="#7c3aed"/><text x="692" y="354" font-family="Arial" font-size="22" font-weight="bold" fill="#1e293b">8%</text><text x="602" y="420" font-family="Arial" font-size="21" fill="#1e293b" text-anchor="end">I rarely search for event information</text><rect x="640" y="403" width="40" height="34" rx="5" fill="#94a3b8"/><text x="692" y="430" font-family="Arial" font-size="22" font-weight="bold" fill="#1e293b">8%</text><text x="20" y="518" font-family="Arial" font-size="17" fill="#64748b">Source: K-Sync Malaysia fan survey (n = 50). Percentages are of all respondents.</text></svg>